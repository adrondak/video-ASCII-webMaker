<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>ASCII Film</title>
<link rel="stylesheet" href="player.css">
</head>
<body class="paused">
<main id="stage">
  <canvas id="film" role="img" aria-label="Animated text-art film" aria-describedby="film-description"></canvas>
  <p id="film-description" class="visually-hidden"></p>
  <p id="status" role="status" aria-live="polite">Loading…</p>
  <button id="big-play" type="button" aria-label="Play" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
  </button>
</main>

<div id="controls" role="toolbar" aria-label="Playback controls">
  <button id="play" type="button" aria-label="Play" data-state="paused">
    <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
    <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
  </button>
  <span id="time" aria-label="Time">0:00 / 0:00</span>
  <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
  <button id="mute" type="button" aria-label="Unmute" data-state="muted">
    <svg class="i-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
    <svg class="i-muted" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9zm11.6 3 2.7-2.7-1.2-1.2-2.7 2.7-2.7-2.7-1.2 1.2 2.7 2.7-2.7 2.7 1.2 1.2 2.7-2.7 2.7 2.7 1.2-1.2z"/></svg>
  </button>
  <input id="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume">
  <button id="loop" type="button" aria-label="Loop" aria-pressed="true">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg>
  </button>
  <button id="theme" type="button" aria-label="Colour theme">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18V3z"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/></svg>
  </button>
  <button id="fullscreen" type="button" aria-label="Full screen" data-state="off">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v2H6v4H4zm10 0h6v6h-2V6h-4zM4 14h2v4h4v2H4zm14 0h2v6h-6v-2h4z"/></svg>
  </button>
</div>

<noscript><p class="noscript">This film is drawn with JavaScript. Please enable it to watch.</p></noscript>
<script type="module" src="player.js"></script>
</body>
</html>
