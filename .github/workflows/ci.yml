name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Install the encoder
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.lock
          .venv/bin/pip install -e . --no-deps

      - name: Python tests (unit + end-to-end encode)
        run: .venv/bin/python -m pytest -q

      - name: Node tests (decoder + glyph physics)
        run: |
          npm ci
          npm test

      - name: Browser tests (Chromium, Firefox, WebKit)
        run: |
          npx playwright install --with-deps chromium firefox webkit
          npx playwright test

      - name: Validate the committed demo film
        run: .venv/bin/ascii-film inspect www/film.ascf

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: tests/artifacts/
          retention-days: 7
